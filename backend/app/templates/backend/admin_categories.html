{% extends "base.html" %}

{% block title %}類別管理{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="text-xl font-bold text-indigo-600">管理後台</a>
                    <a href="/admin/users" class="text-gray-600 hover:text-gray-900">會員管理</a>
                    <a href="/admin/courses" class="text-gray-600 hover:text-gray-900">課程管理</a>
                </div>
                <a href="/admin/logout" class="text-gray-600 hover:text-gray-800">登出</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">類別管理</h1>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">新增類別</h2>
            <form action="/api/admin/categories" method="POST" class="flex gap-2">
                <input type="text" name="name" required placeholder="類別名稱" class="flex-1 px-3 py-2 border rounded-md">
                <input type="number" name="sort_order" placeholder="排序" class="w-24 px-3 py-2 border rounded-md">
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">新增</button>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">名稱</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">排序</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for cat in categories %}
                    <tr>
                        <td class="px-6 py-4">{{ cat.id }}</td>
                        <td class="px-6 py-4">{{ cat.name }}</td>
                        <td class="px-6 py-4">{{ cat.sort_order }}</td>
                        <td class="px-6 py-4">
                            <button onclick="deleteCategory({{ cat.id }})" class="text-red-600 hover:text-red-800">刪除</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function deleteCategory(id) {
    if (confirm('確定要刪除此類別？')) {
        fetch(`/api/admin/categories/${id}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(d => location.reload());
    }
}
</script>
{% endblock %}
